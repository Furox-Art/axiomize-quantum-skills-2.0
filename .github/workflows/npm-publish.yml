name: Release (npm)

# Triggered by the same version-bump commit as the PyPI release, never by hand.
#
# Two credential modes, OIDC preferred
# ------------------------------------
# 1. OIDC Trusted Publishing (default). Requires `id-token: write` and a trusted
#    publisher registered on npmjs.com for owner Furox-Art, package
#    axiomize-quantum-skills-2.0, workflow npm-publish.yml, environment npm.
#    Publishes with --provenance, so the attestation binds the tarball to this
#    workflow run.
# 2. Token (`use_token_fallback: true` on a manual dispatch). Uses the
#    NPM_TOKEN repository secret as NODE_AUTH_TOKEN and publishes WITHOUT
#    --provenance, because a Sigstore attestation is minted from the OIDC
#    identity and a token has none. Strictly weaker: the token is a long-lived
#    shared credential with no per-run identity, so a leak cannot be attributed
#    to a single run.
#
# Token mode exists because the trusted publisher above is not yet registered, and
# mode 1 fails closed without it. It is opt-in per run rather than a fallback the
# workflow takes silently: a publish that quietly downgrades its own credential is
# worse than one that fails and says why. Once the trusted publisher is set up,
# dispatch with the default and delete mode 2.
#
# Node 24, not 22. setup-node's node 22 ships npm 10.9.9, which authenticates via
# OIDC but cannot emit provenance; node 24 ships npm 11.x. Without the bump,
# mode 1 would upload without the attestation it asks for.
#
# Which version, and what happens to the `latest` dist-tag
# --------------------------------------------------------
# This package is published as 1.2.0, the same version PyPI carries, because
# version_lockstep.py requires all five version sources to agree. The npm registry
# already holds 2.0.0, a broken shim, and 2.0.0 sorts *above* 1.2.0.
#
# npm 11+ therefore refuses to imply a dist-tag and aborts:
#
#   Cannot implicitly apply the "latest" tag because previously published version
#   2.0.0 is higher than the new version 1.2.0. You must specify a tag using --tag.
#
# Reproduced against the live registry with `npm publish --dry-run` (npm 11.9.0).
# So `--tag latest` is passed explicitly, and `publishConfig.tag` in package.json
# declares the same intent in the package metadata.
#
# Consequence: publishing moves `latest` from 2.0.0 to 1.2.0 as part of the upload.
# No separate `npm dist-tag add` is needed, and none should be run afterwards. A
# plain `npm install axiomize-quantum-skills-2.0` will then resolve to 1.2.0, which
# is numerically lower than what was there before. That is the intended outcome:
# 2.0.0's index.js has a syntax error and spawns a Python module that does not
# exist, so it cannot have a working consumer. `latest` should mean "the release
# that works", and that is now 1.2.0.

on:
  push:
    branches: [main]
    # The identical trigger to .github/workflows/release.yml. One version bump
    # updates both registries, so the two can never disagree about what version
    # is current -- which is the failure the lockstep check exists to prevent,
    # and which two independently-triggered workflows would eventually cause.
    paths:
      - ".github/pypi-release-trigger"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual publish is needed (recorded in the run)"
        required: true
        type: string
      use_token_fallback:
        description: >-
          Publish with the NPM_TOKEN secret instead of OIDC. Cannot emit
          provenance, because an attestation is minted from the OIDC identity.
          Only for when the npmjs.com trusted publisher is not registered.
        required: false
        default: false
        type: boolean

concurrency:
  # Not cancellable: a release must not be interrupted halfway. Two pushes racing
  # on the same version serialise instead, and the second is stopped by the
  # registry existence gate rather than by a cancellation.
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      # Kept: the environment is what a trusted publisher is bound to, and it is
      # where an approval gate would go if this repository ever wants one.
      name: npm
      url: https://www.npmjs.com/package/axiomize-quantum-skills-2.0
    permissions:
      contents: read
      # Required for the OIDC exchange and for `npm publish --provenance`. Token
      # mode does not use it, but the permission is declared unconditionally
      # because job permissions cannot be set per step and a workflow_dispatch
      # can select either mode.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24, not 22: npm 11 is required for provenance-on-publish. Node 22
          # ships npm 10.9.9, which would upload without the attestation.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Resolve which credential this run uses, before anything can publish.
      # `inputs.*` is empty on a push event, so the comparison is written to treat
      # an absent input as false rather than as a non-empty string, which is what
      # `if: inputs.use_token_fallback` would do.
      - name: Resolve the publish credential mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.use_token_fallback }}" = "true" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "::warning::Running in TOKEN mode: publishing with the NPM_TOKEN secret and no provenance."
            echo "::warning::Register the npmjs.com trusted publisher (owner Furox-Art, package"
            echo "::warning::axiomize-quantum-skills-2.0, workflow npm-publish.yml, environment npm)"
            echo "::warning::and then dispatch again with use_token_fallback=false."
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "::notice::Running in OIDC mode: publishing with trusted publishing and provenance."
          fi

      - name: Report the reason for a manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        # Block scalar: an unquoted `reason: ...` inside a plain YAML scalar is a
        # mapping, not text.
        run: |
          echo "manual publish requested: ${{ inputs.reason }}"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      # Five sources -- pyproject.toml, src/axiomize/__init__.py, package.json,
      # CHANGELOG.md and the trigger file -- must agree. This is what keeps the
      # npm and PyPI versions identical.
      - name: Enforce version lockstep across both registries
        run: python .github/scripts/version_lockstep.py

      # `npm ci` installs exactly the tree in package-lock.json and fails when the
      # lockfile and package.json disagree, which `npm install` does not.
      - name: Install from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax-check the launcher
        run: npm run lint
      - name: Run the npm contract tests
        run: npm test

      # The launcher only proves anything if the Python CLI it spawns is
      # importable. Without this the smoke step fails with `No module named
      # 'axiomize'`, which says nothing about the launcher.
      - name: Install the Python package the launcher invokes
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Smoke the launcher against the installed CLI
        run: npm run smoke

      # `npm publish` derives both the version and the tarball contents from the
      # checked-out repository, so the registry cannot advance past what CI
      # tested.
      - name: Read the version to publish
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Idempotency guard. npm versions are immutable, so a duplicate upload is a
      # hard error, not a no-op. `npm view <pkg>@<version>` exits non-zero when the
      # version is absent, which is the "not yet published" case. A re-run of the
      # same commit therefore exits 0 without uploading.
      - name: Check whether this version already exists on the registry
        id: gate
        shell: bash
        run: |
          set -uo pipefail
          package="axiomize-quantum-skills-2.0"
          version="${{ steps.pkg.outputs.version }}"
          if npm view "${package}@${version}" version > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${package}@${version} is already on the registry; nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${package}@${version} is not on the registry; publishing."
          fi
          exit 0

      # Record the tag state before the upload, so the run summary can state
      # whether the publish moved `latest` or left it alone.
      - name: Record the current dist-tag state
        id: tags
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -uo pipefail
          package="axiomize-quantum-skills-2.0"
          version="${{ steps.pkg.outputs.version }}"
          current="$(npm view "${package}" dist-tags.latest 2>/dev/null || echo '<none>')"
          highest="$(npm view "${package}" versions --json 2>/dev/null | node -e "
            let raw=''; process.stdin.on('data', d => raw += d);
            process.stdin.on('end', () => {
              try {
                const v = JSON.parse(raw);
                const list = Array.isArray(v) ? v : Object.keys(v);
                const stable = list.filter(x => !/[-+]/).sort((a, b) => {
                  const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
                  for (let i = 0; i < 3; i += 1) { if (pa[i] !== pb[i]) return pa[i] - pb[i]; }
                  return 0;
                });
                process.stdout.write(stable[stable.length - 1] || '<none>');
              } catch { process.stdout.write('<unknown>'); }
            });
          ")"
          echo "latest_before=$current" >> "$GITHUB_OUTPUT"
          echo "highest_published=$highest" >> "$GITHUB_OUTPUT"
          {
            echo "### npm pre-publish state"
            echo ""
            echo "- credential mode: \`${{ steps.mode.outputs.mode }}\`"
            echo "- version to publish: \`${version}\`"
            echo "- \`latest\` before: \`${current}\`"
            echo "- highest published version: \`${highest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Tarball contents are asserted against an exact expected list, not merely
      # spot-checked. The 2.0.0 shim shipped src/, tests/ and .github/; the
      # `files` allowlist in package.json is what prevents that, and this step is
      # what proves the allowlist still does.
      - name: Assert the tarball contains exactly the intended files
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected="CHANGELOG.md
          LICENSE
          README.md
          bin/axiomize-quantum.js
          index.js
          package.json"
          actual="$(npm pack --dry-run --json | node -e "
            let raw=''; process.stdin.on('data', d => raw += d);
            process.stdin.on('end', () => {
              const info = JSON.parse(raw);
              process.stdout.write(info[0].files.map(f => f.path).sort().join('\n'));
            });
          ")"
          if [ "$expected" != "$actual" ]; then
            echo "::error::The npm tarball does not match the expected file list."
            echo "--- expected ---"; echo "$expected"
            echo "--- actual ---"; echo "$actual"
            exit 1
          fi
          echo "tarball contents match the allowlist exactly (6 files)"

      # Provenance needs npm >= 11.5.1. Compared numerically rather than with a
      # regex: `^11\.(5[1-9]|[6-9][0-9])\.` reads 11.5.1 as failing (the group
      # demands "51".."59" with no separator, so 11.5.1 never matches) and
      # 11.19.0 as failing too, because `[6-9][0-9]` cannot span a two-digit
      # minor. It rejects the version node 24 actually ships.
      - name: Require npm >= 11.5.1 for provenance
        if: ${{ steps.gate.outputs.skip != 'true' && steps.mode.outputs.mode == 'oidc' }}
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          echo "npm version: ${npm_version}"
          node -e "
            const parse = (v) => String(v).replace(/^v/, '').split('-')[0].split('.').map(Number);
            const compare = (a, b) => {
              const pa = parse(a), pb = parse(b);
              for (let i = 0; i < 3; i += 1) {
                const x = pa[i] || 0, y = pb[i] || 0;
                if (x !== y) return x < y ? -1 : 1;
              }
              return 0;
            };
            const have = process.argv[1], need = process.argv[2];
            if (compare(have, need) < 0) {
              console.error('::error::npm ' + have + ' cannot publish with --provenance; ' + need + ' or newer is required.');
              process.exit(1);
            }
            console.log('npm ' + have + ' satisfies the >= ' + need + ' provenance requirement');
          " "${npm_version}" "11.5.1"

      # Fail closed when the selected mode has no usable credential, checked
      # before the upload rather than inferred from a failed publish. The OIDC
      # case cannot be detected this way -- there is no secret to inspect, and the
      # only honest signal is npm's own error -- so it is called out explicitly.
      - name: Fail closed when the token credential is missing
        if: ${{ steps.gate.outputs.skip != 'true' && steps.mode.outputs.mode == 'token' }}
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::use_token_fallback=true but the NPM_TOKEN secret is empty or unset."
            echo "::error::Add an npm automation token as the NPM_TOKEN repository secret, or"
            echo "::error::register the npmjs.com trusted publisher and dispatch with the default."
            exit 1
          fi
          echo "NPM_TOKEN is present (${#NPM_TOKEN} characters, value not shown)"

      # No `continue-on-error`: a failed publish must fail the run. A publish that
      # reports success while uploading nothing is the exact defect this workflow
      # had when it was stubbed out.
      #
      # `--tag latest` is always explicit, in both modes: the registry already
      # holds 2.0.0, which sorts above this version, so an implicit tag aborts
      # with "Cannot implicitly apply the \"latest\" tag because previously
      # published version 2.0.0 is higher than the new version 1.2.0."
      - name: Publish to npm with OIDC Trusted Publishing and provenance
        if: ${{ steps.gate.outputs.skip != 'true' && steps.mode.outputs.mode == 'oidc' }}
        run: npm publish --access public --provenance --tag latest

      - name: Publish to npm with the NPM_TOKEN secret
        if: ${{ steps.gate.outputs.skip != 'true' && steps.mode.outputs.mode == 'token' }}
        shell: bash
        env:
          # setup-node writes .npmrc referencing NODE_AUTH_TOKEN, so this is the
          # variable npm actually reads for the token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # No --provenance: the attestation is signed from the OIDC identity, and
        # there is no OIDC identity in this mode. Passing it would fail the upload
        # rather than silently produce an unattributed tarball.
        run: npm publish --access public --tag latest

      - name: Verify the publication is publicly visible
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          package="axiomize-quantum-skills-2.0"
          version="${{ steps.pkg.outputs.version }}"
          for attempt in 1 2 3 4 5 6; do
            if npm view "${package}@${version}" version > /dev/null 2>&1; then
              echo "npm publication verified: ${package}@${version}"
              now="$(npm view "${package}" dist-tags.latest 2>/dev/null || echo '<none>')"
              {
                echo ""
                echo "### npm release complete"
                echo ""
                echo "- credential mode: \`${{ steps.mode.outputs.mode }}\`"
                if [ "${{ steps.mode.outputs.mode }}" = "token" ]; then
                  echo "- provenance: **not generated** (token mode has no OIDC identity)"
                else
                  echo "- provenance: attached"
                fi
                echo "- published: \`${package}@${version}\`"
                echo "- \`latest\` now: \`${now}\`"
                if [ "$now" != "$version" ]; then
                  echo ""
                  echo "\`latest\` still points at \`${now}\`, which is a different"
                  echo "version. That is expected here and not an error; see the workflow"
                  echo "header."
                fi
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The upload completed but ${package}@${version} is not publicly visible after 6 attempts."
          exit 1

      - name: Summarise a no-op run
        if: steps.gate.outputs.skip == 'true'
        run: |
          {
            echo "### npm release skipped"
            echo ""
            echo "\`axiomize-quantum-skills-2.0@${{ steps.pkg.outputs.version }}\` is already published."
            echo "npm versions are immutable, so there is nothing to do. To publish a new"
            echo "version, bump every version source together and push:"
            echo ""
            echo '```bash'
            echo "python .github/scripts/version_lockstep.py --bump 1.3.0"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The npmjs.com trusted publisher this workflow prefers, in one place:
      #   owner Furox-Art
      #   package axiomize-quantum-skills-2.0
      #   workflow filename npm-publish.yml
      #   environment npm
      # Until that exists, OIDC mode fails closed at the publish step.