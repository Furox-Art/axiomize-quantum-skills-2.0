name: Pages

on:
  push:
    branches: [main]
  # Build the site on pull requests too, without deploying. Previously the docs
  # were only built after landing, so a broken link or an unstageable page could
  # not be caught in review.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material==9.6.20" "mkdocs==1.6.1" pyyaml
      # Staging lives in a script, shared with the pull-request job below.
      #
      # It used to be inline shell in both jobs, and the copy that linked the
      # staged skill pages at Furox-Art/axiomize -- a different repository --
      # shipped to the live site. The script points every rewritten link at this
      # repository and fails if any staged page links into another one, so the
      # mistake cannot be reintroduced by editing one job and not the other.
      - name: Stage skill docs
        run: python .github/scripts/stage_docs.py
      - run: mkdocs build --strict
      # `mkdocs build --strict` only fails on link, reference and heading
      # problems. A page that exists but is missing from `nav` is reported at
      # INFO and the site builds with it unreachable, which is how 14 pages
      # shipped unpublished-in-practice. This makes that condition fatal.
      - name: Fail when a page is unreachable from the navigation
        run: python .github/scripts/check_docs_nav.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  build-pr:
    name: docs (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material==9.6.20" "mkdocs==1.6.1" pyyaml
      - name: Stage skill docs
        run: python .github/scripts/stage_docs.py
      - run: mkdocs build --strict
      - name: Fail when a page is unreachable from the navigation
        run: python .github/scripts/check_docs_nav.py

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
