name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: no job gets more than it declares. Individual jobs
# widen this only where they genuinely need to (release, Pages deploy).
permissions:
  contents: read

env:
  # Pinned so the coverage number the ratchet gate compares against cannot move
  # because a dependency resolved differently this week. Bump deliberately, in a
  # PR that re-measures the floor.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------------
  # Metadata and packaging contract
  # ---------------------------------------------------------------------

  version-contract:
    name: version lockstep
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      # One product, two registries. pyproject.toml, src/axiomize/__init__.py,
      # package.json, CHANGELOG.md and the PyPI trigger file must agree; they
      # did not (package.json said 2.0.0 while PyPI was on 1.2.0).
      - name: Every version source must agree
        run: python .github/scripts/version_lockstep.py
      - name: Release provenance contract
        run: python .github/scripts/check_release_contract.py
      - name: Security contract
        run: python .github/scripts/security_contract_smoke.py

  # ---------------------------------------------------------------------
  # Static analysis
  # ---------------------------------------------------------------------

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install the pinned linter
        run: python -m pip install "ruff==0.16.9"
      # Configuration lives in [tool.ruff] in pyproject.toml, so the local and CI
      # rule sets cannot diverge. The gate was absent before this change even
      # though the config was already declared.
      - name: Lint
        run: ruff check --output-format=github .
      - name: Report the selected rule families
        run: ruff check --statistics . || true

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install test dependencies and the pinned type checker
        # Pinned exactly, and types-PyYAML with it: a floating mypy can emit a
        # different finding count for identical code, which would make the
        # ratchet below fail for reasons unrelated to the change under review.
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install "mypy==1.18.2" "types-PyYAML==6.0.12.20250915"
      - name: Install axiomize (editable) for import-based checking
        run: python -m pip install -e . --no-deps
      # Config comes from [tool.mypy] in pyproject.toml. Scoped deliberately:
      # `.github/scripts` is held to zero because this repository owns it, while
      # `src/axiomize` and `skills/axiomize/tools` are pinned to their measured
      # counts in .github/mypy-baseline.txt. A gate that is red on arrival
      # teaches people to ignore it; a ratchet that can be raised in the same
      # change that adds an error is not a ratchet. One script enforces both so
      # the two rules cannot drift apart.
      - name: Enforce the type-check ratchet
        run: python .github/scripts/mypy_ratchet.py

  # ---------------------------------------------------------------------
  # Test suite
  # ---------------------------------------------------------------------

  security-contract:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile source tree
        run: python -m compileall -q src skills tests .github/scripts
      - name: Install the pinned auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-audit==2.9.0"
      # Audits the declared lower bounds, which is what users resolve against.
      # Unpinned resolution means a fresh advisory can appear without any
      # commit, so this job is the early warning.
      - name: Audit declared Python dependencies
        run: python -m pip_audit -r requirements-test.txt
      # Builds both artifacts, not just the wheel: the content contract asserts
      # the sdist can rebuild the wheel, so a wheel-only build left the job
      # failing on a missing sdist.
      - name: Audit the shipped dependency metadata
        run: |
          python -m pip install build
          python -m build --outdir dist
          python .github/scripts/package_contents_smoke.py --dist-dir dist

  validate:
    # The OS is part of the job name on purpose. GitHub keys required status
    # checks by the displayed name, so a name of `validate (3.12)` would be
    # reported identically by the Linux and Windows rows, leaving the ruleset
    # unable to require them separately -- and a required check that is never
    # reported blocks the pull request forever.
    name: validate (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared by requires-python and 3.14 is the newest
        # release, so both ends are exercised. The 3.10/3.14 rows are Linux-only
        # to keep the matrix affordable; the middle versions also run on Windows
        # because the repository's own history shows platform-specific failures
        # (a live-socket abort, a Lean-toolchain skip) that Linux alone will not
        # surface.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
        # macOS is deliberately NOT in this matrix.
        # tests/test_reasoning_ablation.py::test_hard_regime_shift_accuracy
        # asserts `controller >= beam + 0.05` from a seeded 200-trial run, and
        # the measured margin is exactly 0.05: Linux and Windows give
        # beam=0.31, controller=0.36, while macOS gives beam=0.315,
        # controller=0.36, so the assertion is false by 5e-3 there. A
        # per-matrix `continue-on-error` does not help: GitHub still reports the
        # job as failed, which turns a required status check red for a defect
        # in a file this change does not own. The test needs a tolerance, not a
        # workflow flag.
        #
        # macOS is still covered by the platform-wheel-cli job, which installs
        # the real wheel and runs the installed CLI contract on every release.
        # Re-add this row once the ablation assertion stops sitting exactly on
        # its threshold.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install axiomize (editable) for import-based tests
        run: python -m pip install -e . --no-deps
      - name: Validate dependency graph
        run: python -m pip check
      - name: Source import graph contract
        run: python .github/scripts/import_contract_smoke.py --source
      - name: Run test suite
        run: python -m pytest tests/ -v
      - name: Skill lint (frontmatter + links + compile)
        run: python skills/axiomize/tools/check_skill.py
      - name: Deterministic SIR checks
        run: python skills/axiomize/tools/validate.py --model sir --beta 0.3 --gamma 0.1
      - name: Stochastic (Gillespie) checks
        run: python skills/axiomize/tools/validate.py --model gillespie --N 10000 --I0 1 --runs 300
      - name: Stochastic subcritical/critical regression (fade-out theory)
        run: |
          python skills/axiomize/tools/validate.py --model gillespie --beta 0.05 --gamma 0.1 --I0 1 --N 10000 --runs 400
          python skills/axiomize/tools/validate.py --model gillespie --beta 0.1 --gamma 0.1 --I0 3 --N 10000 --runs 400
      - name: Queue (Erlang-C) checks
        run: python skills/axiomize/tools/validate.py --model queue --lam 60 --mu 20 --target-wait 3
      - name: Calibration selftests
        run: |
          python skills/axiomize/tools/fit.py --model sir --selftest
          python skills/axiomize/tools/fit.py --model logistic --selftest
      - name: Parallel sweep engine
        run: |
          python skills/axiomize/tools/parallel_sweep.py --job sweep
          python skills/axiomize/tools/parallel_sweep.py --job mc
      # Seeds are fixed (validate.py defaults to 42), so this is a regression
      # gate on the 25 stored blind-test reports rather than a flaky sample.
      # `shell: bash` is required on the Windows rows: the default shell there
      # is PowerShell, which parses the `for` loop and the `$(...)` substitution
      # as a syntax error.
      - name: Benchmark regression (stored blind-test reports)
        shell: bash
        run: |
          ids="$(python -c "import json; print(' '.join(c['id'] for c in json.load(open('benchmarks/ideas.json', encoding='utf-8'))['cases']))")"
          echo "grading cases: $ids"
          for id in $ids; do
            python skills/axiomize/tools/benchmark_runner.py --case "$id" --report "benchmarks/reports/$id.md" || exit 1
          done
      - name: Quantum reasoning benchmark smoke (evaluator + schemas)
        run: |
          python src/axiomize/reasoning/benchmark/evaluate.py --help
          python -c "import json,glob; [json.load(open(p, encoding='utf-8')) for p in glob.glob('src/axiomize/reasoning/benchmark/schemas/*.json')]; print('schemas OK')"
      - name: Model selection bridge smoke (reasoning adapter + CLI)
        run: |
          python -m pip install -e . --no-deps
          axiomize-reason score --evidence 0.9 --verification 0.85
          python -c "from axiomize.workflow.reasoning_adapter import ModelCandidate, select_model; print(select_model([ModelCandidate(candidate_id='a', evidence=1.0, verification=1.0), ModelCandidate(candidate_id='b', evidence=0.4, verification=0.3)]))"

  # ---------------------------------------------------------------------
  # Coverage
  # ---------------------------------------------------------------------

  coverage:
    name: branch-coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The ratchet compares this branch's floor against the base branch, so
          # history must be present.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install axiomize (editable) for import-based tests
        run: python -m pip install -e . --no-deps
      # `-m 'not network'` deselects the one live-socket REST parity test, whose
      # hardcoded 1000-sample Monte Carlo costs ~30s per call. It is not flaky:
      # it passes untraced in the `validate` matrix on every supported
      # interpreter, and the marker exists for cost, not reliability. The scope
      # comes from [tool.coverage.run] and now includes
      # skills/axiomize/tools, which the wheel ships and the previous
      # `--cov=axiomize` silently omitted.
      - name: Enforce the non-decreasing coverage floor
        run: python .github/scripts/coverage_ratchet.py
      - name: Emit the coverage report
        # The previous job declared `files: ./coverage.xml` without ever asking
        # for an XML report, so the Codecov step was pointed at a file that did
        # not exist.
        run: python -m coverage xml
      # The Codecov upload is gone rather than repaired, and the reason is worth
      # recording. This repository has no CODECOV_TOKEN, and Codecov rejects
      # tokenless uploads with "Token required - not valid tokenless upload", so
      # the step had never succeeded; it only looked successful because
      # `fail_ci_if_error: false` swallowed the failure. Making it fatal instead
      # turns a required status check permanently red for a service the project
      # does not use, and gating it on `secrets` in a step `if` is not
      # expressible: the secrets context is unavailable in `if` expressions, and
      # using it there makes GitHub reject the whole workflow file.
      #
      # coverage_ratchet.py is the gate; coverage.xml is published below as a
      # build artifact. To restore reporting, add the CODECOV_TOKEN secret and
      # re-add the codecov/codecov-action step with fail_ci_if_error: true.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # Built artifacts
  # ---------------------------------------------------------------------

  build:
    name: distributions (twine + contents contract)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      # Asserts the built artifacts against the documentation: all nine console
      # entry points resolve, both skill folders and the benchmark corpus ship,
      # and no test/CI/cache content leaks in.
      - name: Enforce the packaging content contract
        run: python .github/scripts/package_contents_smoke.py --dist-dir dist
      - name: Prove the sdist can rebuild the wheel
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          python -c "import tarfile,sys; tarfile.open(sys.argv[1]).extractall(sys.argv[2])" dist/*.tar.gz "$tmp"
          cd "$tmp"/*/
          python -m build --wheel --outdir rebuilt
          ls rebuilt/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  installed-package:
    name: installed-wheel contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Enforce release version contract
        run: python .github/scripts/check_release_contract.py
      # A non-editable install, not `-e .`: hatchling's editable mode only puts
      # src/ on sys.path, so `axiomize-validate` and the six other skill-tool
      # entry points raise ModuleNotFoundError. Testing the real wheel is what
      # users get.
      - name: Build and install the exact wheel artifact
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl
      - name: Validate installed dependency graph
        run: python -m pip check
      - name: Installed package import graph contract
        run: python .github/scripts/import_contract_smoke.py --installed
      - name: Full installed CLI contract
        run: python .github/scripts/cli_release_smoke.py
      - name: General Model IR installed contract
        run: python .github/scripts/general_model_release_smoke.py
      - name: Advanced Model IR installed CLI contract
        run: python .github/scripts/advanced_family_release_smoke.py
      - name: Versioned portable export installed contract
        run: python .github/scripts/portable_export_release_smoke.py
      - name: Validated surrogate installed contract
        run: python .github/scripts/surrogate_release_smoke.py
      - name: Scientific all-family stress matrix
        run: python .github/scripts/scientific_stress_gate.py
      - name: Real LaTeX console conversion
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          printf '# Release Smoke\n\nModel relation: $y = ax + b$.\n' > "$tmp/report.md"
          axiomize-to-latex --input "$tmp/report.md" --output "$tmp/report.tex"
          test -s "$tmp/report.tex"
          grep -F '\begin{document}' "$tmp/report.tex"
          grep -F 'Model relation' "$tmp/report.tex"

  platform-wheel-cli:
    name: wheel-cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build exact wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel
      - name: Install and smoke real wheel + CLI
        run: python .github/scripts/platform_wheel_cli_smoke.py --wheel-dir dist

  # ---------------------------------------------------------------------
  # npm package
  # ---------------------------------------------------------------------

  npm-contract:
    name: npm contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      # `npm ci` installs exactly the tree in package-lock.json and fails when
      # the lockfile and package.json disagree, which `npm install` does not.
      - name: Install from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax-check the launcher and its bin shim
        run: npm run lint
      # Replaces `"test": "echo \"Error: no test specified\" && exit 1"`, which
      # always exited non-zero and was never invoked, so a syntactically broken
      # index.js shipped to npm as 2.0.0.
      - name: Run the npm contract tests
        run: npm test
      # Installed non-editable, because the launcher spawns
      # `python -m axiomize.cli` and an editable install does not put
      # skills/axiomize/tools on the path. The dependency set is installed from
      # requirements-test.txt so the CLI has its real runtime imports.
      - name: Install the Python package the launcher invokes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip install .
      - name: Launch the Python CLI through the npm entry point
        run: npm run smoke
      - name: Assert the published tarball contents
        run: npm pack --dry-run
