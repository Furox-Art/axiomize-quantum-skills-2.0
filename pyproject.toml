[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axiomize-quantum-skills-2.0"
version = "1.2.0"
description = "Axiomize 2.0: scientific modeling engine plus quantum-inspired multi-branch reasoning and Model IR selection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Furox-Art", email = "177975472+Furox-Art@users.noreply.github.com" },
]
keywords = [
    "modeling", "simulation", "first-principles", "calibration", "causal-inference",
    "bayesian", "finite-elements", "scientific-computing", "agent-skills",
    "reasoning", "multi-branch-reasoning", "model-selection", "quantum-inspired",
    "llm-agents", "decision-making", "mathematical-modeling",
    "uncertainty-quantification", "model-ir", "optimization", "reproducibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "networkx>=3.0",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "z3-solver>=4.13,<5; sys_platform == 'darwin'",
    "z3-solver>=4.12; sys_platform != 'darwin'",
    "control>=0.10",
    "cvxpy>=1.5",
    "casadi>=3.6",
]

[project.optional-dependencies]
full = ["pymc>=5.0", "jax>=0.4"]
playground = ["gradio>=4.0", "pandas>=1.5"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/Furox-Art/axiomize-quantum-skills-2.0"
Repository = "https://github.com/Furox-Art/axiomize-quantum-skills-2.0"
Issues = "https://github.com/Furox-Art/axiomize-quantum-skills-2.0/issues"
Documentation = "https://furox-art.github.io/axiomize-quantum-skills-2.0/"

[project.scripts]
axiomize = "axiomize.cli:main"
axiomize-reason = "axiomize.reasoning.cli:main"
axiomize-validate = "axiomize.tools.validate:main"
axiomize-fit = "axiomize.tools.fit:main"
axiomize-csv-check = "axiomize.tools.csv_check:main"
axiomize-benchmark = "axiomize.tools.benchmark_runner:main"
axiomize-to-latex = "axiomize.tools.report_to_latex:main"
axiomize-index-reports = "axiomize.tools.index_reports:main"
axiomize-sweep = "axiomize.tools.parallel_sweep:main"

[tool.hatch.build.targets.wheel]
packages = ["src/axiomize"]

[tool.hatch.build.targets.wheel.force-include]
"skills/axiomize/tools" = "axiomize/tools"
"skills/axiomize/SKILL.md" = "axiomize/SKILL.md"
"skills/axiomize/adaptive-workflow.md" = "axiomize/adaptive-workflow.md"
"skills/axiomize/rigor.md" = "axiomize/rigor.md"
"skills/axiomize/archetypes.md" = "axiomize/archetypes.md"
"skills/axiomize/first-principles.md" = "axiomize/first-principles.md"
"skills/axiomize/perspectives" = "axiomize/perspectives"
"skills/axiomize/templates" = "axiomize/templates"
"skills/quantum-reasoning" = "axiomize/quantum-reasoning"
"benchmarks/ideas.json" = "axiomize/data/benchmark_ideas.json"

[tool.hatch.build.targets.sdist]
# The sdist must be able to rebuild the wheel, so the force-included trees stay
# in. Everything below is either a cache, a build output, or a large binary
# asset that no downstream consumer needs. The three excluded media files were
# 412 KB of the 867 KB tarball (sir-demo.gif, report-sample.pdf, sir-example.png)
# and none of them is referenced by the packaging contract.
exclude = [
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "dist",
    "site",
    "node_modules",
    "*.gif",
    "*.png",
    "*.pdf",
]

[tool.ruff]
# Lint is a gate in CI (.github/workflows/ci.yml, job `lint`), so the selected
# set is the one that is actually clean on `main`. It starts from ruff's
# correctness tier (E9, F63, F7, F82) and adds the bug-prone families that pass
# today. Broader families (ANN 626, D 897, EM 935, TRY 1040, PL 755) are
# deliberately NOT enabled: turning them on without first fixing the code would
# mean a permanently red gate, which is worse than a narrow honest one. Widen
# this list in a PR that also cleans up the violations it surfaces.
target-version = "py310"
line-length = 100
extend-exclude = [".mypy_cache", ".pytest_cache", ".ruff_cache", "dist", "site", "node_modules"]

[tool.ruff.lint]
select = [
    # Correctness: syntax errors and undefined names. Never suppress these.
    "E9",
    "F63",
    "F7",
    "F82",
    # Bug-prone, currently clean.
    "PIE",  # misc simplification
    "RSE",  # raise / unpacking correctness
    "TID",  # tidy imports banned by the security contract
    "FA",   # postponed annotations, which break at runtime if mishandled
    "FLY",  # static string joins
    "LOG",  # misuse of logging f-strings
    "G",    # logging format rules
    "SLOT",  # dataclass slots correctness
]

[tool.ruff.lint.per-file-ignores]
# `_model()` annotates `-> "ModelIR"` while importing ModelIR inside the function
# body. The annotation is a string and never evaluated at runtime, so the test
# passes; F821 cannot see the function-local import. Fixed in the source module
# rather than here; this entry exists so the lint gate is green meanwhile.
"tests/test_bayesian_likelihoods.py" = ["F821"]
# `import numpy as np` and `import networkx as nx` are the canonical spellings
# for those two ecosystems; renaming them to satisfy ICN001 would be wrong.
"playground/app.py" = ["ICN001"]
"tests/test_adaptive_workflow.py" = ["ICN001"]

[tool.ruff.lint.isort]
# Not enabled yet (I001 is 34 findings today), but configured so enabling it
# later does not also churn the whole import layout.
known-first-party = ["axiomize"]

[tool.mypy]
# The CI `typecheck` job pins this to the same interpreter the coverage gate
# uses. 3.13 was previously declared while the matrix also ran 3.10-3.12, so
# type errors could be invisible on the versions users actually install.
python_version = "3.12"
# New errors must be fixed, not absorbed: a ratchet is the wrong tool for a
# package with 47 known findings, because a silent baseline hides the ones that
# matter. The gate is scoped in CI to the directories this repository owns.
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "sympy.*", "scipy.*", "numpy.*", "networkx.*", "statsmodels.*",
    "matplotlib.*", "z3.*", "control.*", "cvxpy.*", "casadi.*", "pymc", "fenics", "dolfin.*",
    "dolfinx.*", "ufl", "ufl.*", "petsc4py", "petsc4py.*", "mpi4py", "mpi4py.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["casadi", "casadi.*"]
follow_imports = "skip"
ignore_missing_imports = true
ignore_errors = true

# The wheel ships no `py.typed` marker, because src/axiomize is not annotated
# for public consumption. Without this override every consumer of the installed
# package (and this repository's own CI scripts, which import it) reports
# `import-untyped` for otherwise valid imports. Adding the marker is a typing
# change for the library and belongs with the code that would satisfy it.
[[tool.mypy.overrides]]
module = ["axiomize", "axiomize.*"]
ignore_missing_imports = true
follow_imports = "normal"

[tool.pytest.ini_options]
markers = [
  "slow: exercises a full model simulation; still run by CI, but slow enough to deselect locally",
  "network: binds a real HTTP server on a real port and costs a ~30s Monte Carlo per call; deselected only from the coverage job",
]
# Deselect nothing by default: a contributor running `pytest` must get the same
# set CI runs, otherwise a locally green run can hide a CI failure.
addopts = "-ra"

[tool.coverage.run]
# `--cov=axiomize` alone measured only `src/axiomize` (9404 statements) and
# silently excluded the 1315 statements of `skills/axiomize/tools/*.py`, which
# the wheel force-includes as `axiomize/tools/` and which back seven of the
# nine console entry points. Naming both roots makes the number describe the
# code that actually ships.
branch = true
source = ["src/axiomize", "skills/axiomize/tools"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# The eight skill-tool modules are shipped and reachable, so a missing import
# in one of them is a packaging bug, not a coverage artefact.
ignore_errors = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
